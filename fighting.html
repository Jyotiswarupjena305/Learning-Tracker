<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Arena Fighter</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:'Inter',sans-serif;color:#e0e0e0}
canvas{display:block;width:100%;height:100%}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui-layer *{pointer-events:auto}
.hidden{display:none!important}
.neon-green{color:#39ff14}.neon-pink{color:#ff2d95}.neon-cyan{color:#00e5ff}.neon-gold{color:#ffd700}
.bg-glass{background:rgba(15,15,25,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:12px}
.btn{font-family:'Chakra Petch',sans-serif;font-weight:700;padding:12px 32px;border:2px solid;border-radius:8px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;letter-spacing:2px;background:transparent;font-size:14px}
.btn:hover{transform:scale(1.05);box-shadow:0 0 20px currentColor}
.btn-green{color:#39ff14;border-color:#39ff14}.btn-green:hover{background:rgba(57,255,20,0.15)}
.btn-pink{color:#ff2d95;border-color:#ff2d95}.btn-pink:hover{background:rgba(255,45,149,0.15)}
.btn-cyan{color:#00e5ff;border-color:#00e5ff}.btn-cyan:hover{background:rgba(0,229,255,0.15)}
.btn-gold{color:#ffd700;border-color:#ffd700}.btn-gold:hover{background:rgba(255,215,0,0.15)}
.title-font{font-family:'Chakra Petch',sans-serif}
#main-menu,#settings-screen,#victory-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#lobby-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;overflow-x:hidden;padding:24px 16px 40px;box-sizing:border-box;z-index:20}
#lobby-screen::-webkit-scrollbar{width:8px}
#lobby-screen::-webkit-scrollbar-track{background:rgba(0,0,0,0.3)}
#lobby-screen::-webkit-scrollbar-thumb{background:rgba(57,255,20,0.3);border-radius:4px}
#lobby-screen::-webkit-scrollbar-thumb:hover{background:rgba(57,255,20,0.6)}
.menu-title{font-size:64px;font-weight:700;letter-spacing:6px;text-shadow:0 0 30px rgba(57,255,20,0.5)}
.menu-subtitle{font-size:18px;color:#888;margin-top:8px;letter-spacing:4px}
.menu-buttons{display:flex;flex-direction:column;gap:16px;margin-top:40px}
.lobby-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:90%;max-width:850px;margin-top:12px}
.player-slot{padding:14px;text-align:center;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 0.3s}
.player-slot.joined{border-color:currentColor!important;box-shadow:0 0 15px rgba(255,255,255,0.1)}
.power-select{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.power-btn{padding:6px 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);cursor:pointer;font-size:12px;color:#ccc;transition:all 0.2s}
.power-btn:hover{border-color:#fff;color:#fff}.power-btn.selected{border-color:currentColor;background:rgba(255,255,255,0.15);font-weight:700}
.arena-select{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.arena-card{padding:12px 18px;border-radius:10px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);cursor:pointer;text-align:center;transition:all 0.2s;width:180px}
.arena-card:hover{border-color:rgba(255,255,255,0.3)}.arena-card.selected{border-color:#39ff14;box-shadow:0 0 15px rgba(57,255,20,0.2)}
.settings-panel{width:80%;max-width:800px;max-height:70vh;overflow-y:auto;padding:30px}
.settings-panel::-webkit-scrollbar{width:6px}.settings-panel::-webkit-scrollbar-track{background:transparent}
.settings-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:3px}
.key-bind{display:inline-block;padding:4px 12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:4px;font-family:monospace;cursor:pointer;margin:2px;transition:all 0.2s;min-width:40px;text-align:center}
.key-bind:hover{border-color:#39ff14}.key-bind.listening{border-color:#ff2d95;background:rgba(255,45,149,0.2);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.round-select{display:flex;gap:8px;margin-top:12px}
.round-btn{padding:6px 16px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#ccc;cursor:pointer;font-size:14px}
.round-btn.selected{border-color:#39ff14;color:#39ff14;background:rgba(57,255,20,0.1)}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:15}
.kill-feed{position:absolute;top:60px;right:20px;display:flex;flex-direction:column;gap:6px}
.kill-msg{padding:6px 14px;border-radius:6px;background:rgba(0,0,0,0.7);font-size:13px;animation:fadeInOut 3s forwards;white-space:nowrap}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(20px)}10%{opacity:1;transform:translateX(0)}80%{opacity:1}100%{opacity:0}}
.stock-display{display:flex;gap:4px;margin-top:4px}
.stock-icon{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,0.3)}
.stock-icon.alive{background:currentColor}
.timer-display{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-family:'Chakra Petch',sans-serif;font-size:28px;font-weight:700;text-shadow:0 0 10px rgba(255,255,255,0.3)}
.player-hud{position:absolute;padding:8px 14px;border-radius:8px;background:rgba(10,10,20,0.8);border:1px solid rgba(255,255,255,0.1);min-width:120px}
.player-hud .name{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;margin-bottom:4px}
.player-hud .pct{font-family:'Chakra Petch',sans-serif;font-size:22px;font-weight:700}
.player-hud .power-cd{height:3px;border-radius:2px;background:rgba(255,255,255,0.1);margin-top:4px;overflow:hidden}
.player-hud .power-cd-fill{height:100%;border-radius:2px;transition:width 0.1s}
.victory-title{font-size:48px;font-weight:700;margin-bottom:10px}
.victory-sub{font-size:20px;color:#aaa;margin-bottom:30px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;width:80%;max-width:700px;margin-bottom:30px}
.stat-card{padding:16px;text-align:center;border-radius:10px}
.stat-card .stat-val{font-size:28px;font-weight:700;font-family:'Chakra Petch',sans-serif}
.stat-card .stat-label{font-size:12px;color:#999;margin-top:4px}

/* Mobile Virtual Touch Controls */
.touch-btn {
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  font-family: 'Chakra Petch', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.08s ease;
}
.touch-btn:active, .touch-btn.pressed {
  transform: scale(0.91);
  filter: brightness(1.4);
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
<!-- Main Menu -->
<div id="main-menu">
<div class="menu-title title-font neon-green">STICKMAN<br>ARENA</div>
<div class="menu-subtitle title-font">FIGHT TO THE DEATH</div>
<div class="menu-buttons">
<button class="btn btn-green" onclick="showLobby()">PLAY</button>
<button class="btn btn-cyan" onclick="showSettings()">SETTINGS</button>
<button class="btn btn-pink" onclick="window.location.href='index.html'">← HUB</button>
</div>
<div style="margin-top:40px;color:#555;font-size:12px;letter-spacing:2px">2-4 PLAYERS • LOCAL MULTIPLAYER</div>
</div>

<!-- Lobby -->
<div id="lobby-screen" class="hidden">
<div class="title-font" style="font-size:32px;font-weight:700;letter-spacing:4px;margin-bottom:6px">LOBBY</div>
<div style="color:#888;font-size:13px;letter-spacing:2px;margin-bottom:10px">PRESS A KEY TO JOIN</div>
<div class="lobby-grid" id="lobby-grid"></div>
<div style="margin-top:16px;text-align:center">
<div class="title-font" style="font-size:14px;color:#aaa;margin-bottom:6px">SELECT ARENA</div>
<div class="arena-select" id="arena-select"></div>
</div>
<div style="margin-top:10px;text-align:center">
<div class="title-font" style="font-size:14px;color:#aaa;margin-bottom:6px">ROUNDS (BEST OF)</div>
<div class="round-select" id="round-select"></div>
</div>
<div style="margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
<button class="btn btn-cyan" onclick="addBotPlayer()">+ ADD AI BOT</button>
<button class="btn btn-green" id="start-btn" onclick="startGame()">START FIGHT</button>
<button class="btn btn-pink" onclick="showMainMenu()">BACK</button>
</div>
</div>

<!-- Settings -->
<div id="settings-screen" class="hidden">
<div class="title-font" style="font-size:32px;font-weight:700;letter-spacing:4px;margin-bottom:20px">SETTINGS</div>
<div class="settings-panel bg-glass" id="settings-panel"></div>
<div style="margin-top:20px;display:flex;gap:12px">
<button class="btn btn-cyan" onclick="resetBindings()">RESTORE DEFAULTS</button>
<button class="btn btn-pink" onclick="showMainMenu()">BACK</button>
</div>
</div>

<!-- HUD (shown during gameplay) -->
<div id="hud" class="hidden">
<div class="timer-display" id="timer-display">60</div>
<div class="kill-feed" id="kill-feed"></div>
<div id="player-huds"></div>
<div style="position:absolute;top:15px;left:20px;font-family:'Chakra Petch',sans-serif;font-size:14px;color:#aaa" id="round-display"></div>
</div>

<!-- Mobile Virtual Touch Controls -->
<div id="touch-controls" style="display:none; position:fixed; inset:0; z-index:35; pointer-events:none;">
  <!-- Top Bar: Exit to Menu -->
  <div style="position:absolute; top:14px; right:16px; pointer-events:auto; display:flex; gap:10px;">
    <button class="touch-btn text-xs px-3 py-2 text-cyan-300 border border-cyan-500/40" style="background:rgba(10,20,35,0.75);" onclick="showMainMenu()">🏠 MENU</button>
  </div>

  <!-- Left Cluster: 4-Way D-Pad -->
  <div style="position:absolute; bottom:20px; left:20px; width:160px; height:160px; pointer-events:auto;">
    <!-- Up / Jump -->
    <div id="t-btn-up" class="touch-btn border-2 border-cyan-400 text-cyan-300 text-2xl font-bold" style="position:absolute; top:0; left:50px; width:56px; height:50px; box-shadow:0 0 14px rgba(0,255,200,0.3); background:rgba(0,240,255,0.14);">▲</div>
    <!-- Left -->
    <div id="t-btn-left" class="touch-btn border-2 border-cyan-400 text-cyan-300 text-2xl font-bold" style="position:absolute; top:52px; left:0; width:50px; height:56px; box-shadow:0 0 14px rgba(0,255,200,0.3); background:rgba(0,240,255,0.14);">◀</div>
    <!-- Right -->
    <div id="t-btn-right" class="touch-btn border-2 border-cyan-400 text-cyan-300 text-2xl font-bold" style="position:absolute; top:52px; right:0; width:50px; height:56px; box-shadow:0 0 14px rgba(0,255,200,0.3); background:rgba(0,240,255,0.14);">▶</div>
    <!-- Down / Drop -->
    <div id="t-btn-down" class="touch-btn border-2 border-cyan-400 text-cyan-300 text-2xl font-bold" style="position:absolute; bottom:0; left:50px; width:56px; height:50px; box-shadow:0 0 14px rgba(0,255,200,0.3); background:rgba(0,240,255,0.14);">▼</div>
  </div>

  <!-- Right Cluster: Action Buttons -->
  <div style="position:absolute; bottom:18px; right:18px; display:grid; grid-template-columns: 66px 66px 66px; grid-template-rows: 66px 66px; gap:10px; pointer-events:auto;">
    <!-- Top row: Block, Pick, Special -->
    <div id="t-btn-block" class="touch-btn border-2 border-cyan-400 text-cyan-300 text-xs font-extrabold flex flex-col items-center justify-center leading-none" style="box-shadow:0 0 16px rgba(0,212,255,0.35); background:rgba(0,212,255,0.16);">
      <span style="font-size:22px; margin-bottom:2px;">🛡️</span><span>PARRY</span>
    </div>
    <div id="t-btn-pickup" class="touch-btn border-2 border-amber-400 text-amber-300 text-xs font-extrabold flex flex-col items-center justify-center leading-none" style="box-shadow:0 0 16px rgba(251,191,36,0.35); background:rgba(251,191,36,0.16);">
      <span style="font-size:22px; margin-bottom:2px;">🖐️</span><span>PICK</span>
    </div>
    <div id="t-btn-special" class="touch-btn border-2 border-purple-400 text-purple-300 text-xs font-extrabold flex flex-col items-center justify-center leading-none" style="box-shadow:0 0 20px rgba(168,85,247,0.45); background:rgba(168,85,247,0.22);">
      <span style="font-size:22px; margin-bottom:2px;">✨</span><span>POWER</span>
    </div>

    <!-- Bottom row: Light Slash, Heavy Strike, Jump -->
    <div id="t-btn-light" class="touch-btn border-2 border-emerald-400 text-emerald-300 text-xs font-extrabold flex flex-col items-center justify-center leading-none" style="box-shadow:0 0 22px rgba(52,211,153,0.45); background:rgba(16,185,129,0.25);">
      <span style="font-size:22px; margin-bottom:2px;">⚔️</span><span>LIGHT</span>
    </div>
    <div id="t-btn-heavy" class="touch-btn border-2 border-rose-500 text-rose-300 text-xs font-extrabold flex flex-col items-center justify-center leading-none" style="box-shadow:0 0 20px rgba(244,63,94,0.45); background:rgba(225,29,72,0.25);">
      <span style="font-size:22px; margin-bottom:2px;">💥</span><span>HEAVY</span>
    </div>
    <div id="t-btn-jump" class="touch-btn border-2 border-blue-400 text-blue-300 text-xs font-extrabold flex flex-col items-center justify-center leading-none" style="box-shadow:0 0 20px rgba(96,165,250,0.45); background:rgba(59,130,246,0.25);">
      <span style="font-size:22px; margin-bottom:2px;">⏫</span><span>JUMP</span>
    </div>
  </div>
</div>

<!-- Victory Screen -->
<div id="victory-screen" class="hidden">
<div class="victory-title title-font" id="victory-title"></div>
<div class="victory-sub" id="victory-sub"></div>
<div class="stats-grid" id="stats-grid"></div>
<div style="display:flex;gap:12px">
<button class="btn btn-green" onclick="showLobby()">REMATCH</button>
<button class="btn btn-pink" onclick="showMainMenu()">MAIN MENU</button>
</div>
</div>
</div>

<script>
// ============================================================
// STICKMAN ARENA FIGHTER - Complete Game
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ---- CONSTANTS ----
const GRAVITY = 0.55;
const MAX_FALL = 14;
const COYOTE_TIME = 100;
const JUMP_FORCE = -11.5;
const DOUBLE_JUMP_FORCE = -10;
const MOVE_SPEED = 4.2;
const AIR_CONTROL = 0.7;
const WALL_SLIDE_SPEED = 2;
const PARRY_WINDOW = 200;
const SUDDEN_DEATH_TIME = 60;
const STOCK_COUNT = 3;
const WEAPON_SPAWN_INTERVAL = 8000;
const PLAYER_COLORS = ['#39ff14','#ff2d95','#00e5ff','#ffd700'];
const PLAYER_NAMES = ['P1','P2','P3','P4'];
const POWER_NAMES = ['Lightning','Fire','Ice','Wind'];
const POWER_COLORS = ['#b388ff','#ff6d00','#80d8ff','#b2ff59'];
const ARENA_NAMES = ['Lava Platforms','Collapsing Bridge','Conveyor Factory'];
const WEAPON_TYPES = ['Katana','Broadsword','Dual Daggers'];

// ---- GAME STATE ----
let gameState = 'menu'; // menu, lobby, settings, playing, victory
let players = [];
let activePlayers = [];
let particles = [];
let projectiles = [];
let weapons = [];
let killFeed = [];
let platforms = [];
let hazards = [];
let arenaEffects = [];
let camera = {x:0,y:0,zoom:1,targetX:0,targetY:0,targetZoom:1,shake:0};
let roundTimer = SUDDEN_DEATH_TIME;
let suddenDeath = false;
let currentArena = 0;
let selectedArena = 0;
let bestOf = 3;
let currentRound = 1;
let roundWins = [0,0,0,0];
let matchOver = false;
let weaponSpawnTimer = 0;
let lastTime = 0;
let dt = 0;
let frameCount = 0;
let arenaWidth = 1400;
let arenaHeight = 900;
let lobbyJoinKeys = {};
let gameStats = [{kills:0,deaths:0,damage:0},{kills:0,deaths:0,damage:0},{kills:0,deaths:0,damage:0},{kills:0,deaths:0,damage:0}];
let suddenDeathActive = false;
let countdownTimer = 0;
let countdownText = '';
let gamePhase = 'countdown'; // countdown, fighting, roundEnd

// ---- INPUT ----
const keys = {};
const keyJustPressed = {};
const keyWasDown = {};

// Default key bindings
const DEFAULT_BINDINGS = [
  {left:'a',right:'d',up:'w',down:'s',jump:'u',light:'j',heavy:'k',special:'l',block:'i',pickup:'o'},
  {left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',jump:'Numpad0',light:'Numpad1',heavy:'Numpad2',special:'Numpad3',block:'Numpad4',pickup:'Numpad5'},
  {left:'f',right:'h',up:'t',down:'g',jump:'b',light:'z',heavy:'x',special:'c',block:'v',pickup:'n'},
  {left:'Numpad4',right:'Numpad6',up:'Numpad8',down:'Numpad5',jump:'Numpad7',light:'-',heavy:'+',special:'Enter',block:'.',pickup:'Numpad9'}
];

let keyBindings = JSON.parse(JSON.stringify(DEFAULT_BINDINGS));

// Default Gamepad bindings
const DEFAULT_GAMEPAD_BINDINGS = [
  { left:'axis:0-', right:'axis:0+', up:'axis:1-', down:'axis:1+', jump:'btn:0', light:'btn:2', heavy:'btn:3', special:'btn:1', block:'btn:7', pickup:'btn:5' },
  { left:'axis:0-', right:'axis:0+', up:'axis:1-', down:'axis:1+', jump:'btn:0', light:'btn:2', heavy:'btn:3', special:'btn:1', block:'btn:7', pickup:'btn:5' },
  { left:'axis:0-', right:'axis:0+', up:'axis:1-', down:'axis:1+', jump:'btn:0', light:'btn:2', heavy:'btn:3', special:'btn:1', block:'btn:7', pickup:'btn:5' },
  { left:'axis:0-', right:'axis:0+', up:'axis:1-', down:'axis:1+', jump:'btn:0', light:'btn:2', heavy:'btn:3', special:'btn:1', block:'btn:7', pickup:'btn:5' }
];

let gamepadBindings = JSON.parse(JSON.stringify(DEFAULT_GAMEPAD_BINDINGS));

function formatGamepadButton(code) {
  if (!code) return 'None';
  const NAMES = {
    'btn:0': 'A / ✕',
    'btn:1': 'B / ◯',
    'btn:2': 'X / ▢',
    'btn:3': 'Y / △',
    'btn:4': 'LB / L1',
    'btn:5': 'RB / R1',
    'btn:6': 'LT / L2',
    'btn:7': 'RT / R2',
    'btn:8': 'Select',
    'btn:9': 'Start',
    'btn:10': 'L3',
    'btn:11': 'R3',
    'btn:12': 'D-Up',
    'btn:13': 'D-Down',
    'btn:14': 'D-Left',
    'btn:15': 'D-Right',
    'axis:0-': 'Stick ◀',
    'axis:0+': 'Stick ▶',
    'axis:1-': 'Stick ▲',
    'axis:1+': 'Stick ▼'
  };
  return NAMES[code] || code;
}

// Load / Save bindings
function loadBindings() {
  const saved = localStorage.getItem('stickfight_bindings');
  if (saved) {
    try { keyBindings = JSON.parse(saved); } catch(e) { keyBindings = JSON.parse(JSON.stringify(DEFAULT_BINDINGS)); }
  }
  const savedGp = localStorage.getItem('stickfight_gp_bindings');
  if (savedGp) {
    try { gamepadBindings = JSON.parse(savedGp); } catch(e) { gamepadBindings = JSON.parse(JSON.stringify(DEFAULT_GAMEPAD_BINDINGS)); }
  }
}
function saveBindings() {
  localStorage.setItem('stickfight_bindings', JSON.stringify(keyBindings));
  localStorage.setItem('stickfight_gp_bindings', JSON.stringify(gamepadBindings));
}
function resetBindings() {
  keyBindings = JSON.parse(JSON.stringify(DEFAULT_BINDINGS));
  gamepadBindings = JSON.parse(JSON.stringify(DEFAULT_GAMEPAD_BINDINGS));
  saveBindings();
  renderSettings();
}
loadBindings();

function triggerFighterRumble(pi, weak = 0.4, strong = 0.8, duration = 160) {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = gamepads[pi];
  if (gp && gp.vibrationActuator) {
    gp.vibrationActuator.playEffect('dual-rumble', {
      startDelay: 0,
      duration: duration,
      weakMagnitude: weak,
      strongMagnitude: strong
    }).catch(() => {});
  }
}

function testFighterRumble() {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  let found = false;
  for (let i = 0; i < gamepads.length; i++) {
    if (gamepads[i] && gamepads[i].vibrationActuator) {
      triggerFighterRumble(i, 0.6, 0.9, 300);
      found = true;
    }
  }
  const sb = document.getElementById('gp-status-msg');
  if (sb) {
    sb.textContent = found ? '⚡ VIBRATION SENT TO CONTROLLER!' : '⚠ No vibration-capable gamepad detected. Press any button to wake.';
  }
}

// Gamepad polling state
const gpJustPressed = {};
const prevGpButtons = {};

function checkGamepadAction(playerIdx, action) {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = gamepads[playerIdx];
  if (!gp) return false;
  const gpb = gamepadBindings[playerIdx] || DEFAULT_GAMEPAD_BINDINGS[0];
  const code = gpb[action];
  if (!code) return false;

  if (code.startsWith('btn:')) {
    const bi = parseInt(code.split(':')[1], 10);
    return !!(gp.buttons[bi] && (gp.buttons[bi].pressed || gp.buttons[bi].value > 0.3));
  }
  if (code.startsWith('axis:')) {
    const parts = code.split(':')[1];
    const ai = parseInt(parts.slice(0, -1), 10);
    const dir = parts.slice(-1);
    if (dir === '-') return gp.axes[ai] < -0.35;
    if (dir === '+') return gp.axes[ai] > 0.35;
  }
  return false;
}

// Key listeners
document.addEventListener('keydown', e => {
  e.preventDefault();
  const k = e.key === ' ' ? 'Space' : e.key;
  if (!keyWasDown[k]) keyJustPressed[k] = true;
  keys[k] = true;
  keyWasDown[k] = true;
  if (gameState === 'lobby') handleLobbyJoin(k);
  if (settingsListening && settingsListening.type === 'key') { handleSettingsBind(k); return; }
});
document.addEventListener('keyup', e => {
  const k = e.key === ' ' ? 'Space' : e.key;
  keys[k] = false;
  keyWasDown[k] = false;
});

// Touch Controls State
let touchDetected = false;
let touchMode = 'auto'; // 'auto' | 'on' | 'off'
const touchState = { left: false, right: false, up: false, down: false, jump: false, light: false, heavy: false, special: false, block: false, pickup: false };
const touchJustPressed = { jump: false, light: false, heavy: false, special: false, block: false, pickup: false, up: false };

function isTouchActive() {
  if (touchMode === 'on') return true;
  if (touchMode === 'off') return false;
  return touchDetected || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth < 1024);
}

function updateTouchVisibility() {
  const el = document.getElementById('touch-controls');
  if (!el) return;
  if (gameState === 'playing' && isTouchActive()) {
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function setupTouchControls() {
  window.addEventListener('touchstart', () => { touchDetected = true; }, { passive: true, once: true });

  function bindTouch(id, action, isTrigger = false) {
    const el = document.getElementById(id);
    if (!el) return;
    const press = () => {
      touchState[action] = true;
      if (isTrigger) touchJustPressed[action] = true;
      el.classList.add('pressed');
    };
    const release = () => {
      touchState[action] = false;
      el.classList.remove('pressed');
    };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
    el.addEventListener('pointerup', (e) => { e.preventDefault(); release(); });
    el.addEventListener('pointercancel', (e) => { e.preventDefault(); release(); });
    el.addEventListener('pointerleave', (e) => { e.preventDefault(); release(); });
  }

  bindTouch('t-btn-up', 'up', true);
  bindTouch('t-btn-down', 'down');
  bindTouch('t-btn-left', 'left');
  bindTouch('t-btn-right', 'right');
  bindTouch('t-btn-jump', 'jump', true);
  bindTouch('t-btn-light', 'light', true);
  bindTouch('t-btn-heavy', 'heavy', true);
  bindTouch('t-btn-special', 'special', true);
  bindTouch('t-btn-block', 'block', true);
  bindTouch('t-btn-pickup', 'pickup', true);
}

function isKeyDown(playerIdx, action) {
  if (playerIdx === 0 && isTouchActive()) {
    if (action === 'jump' && touchState.up) return true;
    if (touchState[action]) return true;
  }
  if (checkGamepadAction(playerIdx, action)) return true;
  return keys[keyBindings[playerIdx][action]] || false;
}
function isKeyJustPressed(playerIdx, action) {
  if (playerIdx === 0 && isTouchActive()) {
    if (action === 'jump' && (touchJustPressed.jump || touchJustPressed.up)) return true;
    if (touchJustPressed[action]) return true;
  }
  if (gpJustPressed[playerIdx + '_' + action]) return true;
  return keyJustPressed[keyBindings[playerIdx][action]] || false;
}

// ---- AUDIO ENGINE ----
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type, vol = 0.3) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(vol, now);

    switch(type) {
      case 'slash':
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12); break;
      case 'heavy':
        osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
        gain.gain.setValueAtTime(vol * 1.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25); break;
      case 'power':
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now); osc.stop(now + 0.35); break;
      case 'death':
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.start(now); osc.stop(now + 0.6); break;
      case 'parry':
        osc.type = 'triangle'; osc.frequency.setValueAtTime(1500, now);
        osc.frequency.exponentialRampToValueAtTime(2000, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15); break;
      case 'pickup':
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15); break;
      case 'cheer':
        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.2);
        osc.frequency.linearRampToValueAtTime(900, now + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now); osc.stop(now + 0.5); break;
      case 'freeze':
        osc.type = 'sine'; osc.frequency.setValueAtTime(2000, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25); break;
      case 'thunder':
        osc.type = 'square'; osc.frequency.setValueAtTime(100, now);
        osc.frequency.setValueAtTime(2000, now + 0.02);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
        gain.gain.setValueAtTime(vol * 2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now); osc.stop(now + 0.2); break;
      case 'wind':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(500, now + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now); osc.stop(now + 0.4); break;
      case 'countdown':
        osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15); break;
      case 'go':
        osc.type = 'square'; osc.frequency.setValueAtTime(880, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3); break;
      default:
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    }
  } catch(e) {}
}

function playNoise(duration = 0.1, vol = 0.15) {
  try {
    const bufSize = audioCtx.sampleRate * duration;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    src.connect(gain); gain.connect(audioCtx.destination);
    src.start(); src.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// ---- PARTICLE SYSTEM ----
function spawnParticles(x, y, color, count, speed, life, size) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = (Math.random() * 0.7 + 0.3) * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - Math.random() * 2,
      life: life * (0.7 + Math.random() * 0.6),
      maxLife: life * (0.7 + Math.random() * 0.6),
      color,
      size: size * (0.5 + Math.random()),
      gravity: 0.1
    });
  }
}

function spawnDirectionalParticles(x, y, color, count, dirX, dirY, speed, life, size) {
  for (let i = 0; i < count; i++) {
    const angle = Math.atan2(dirY, dirX) + (Math.random() - 0.5) * 0.8;
    const spd = (Math.random() * 0.5 + 0.5) * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: life * (0.7 + Math.random() * 0.3),
      maxLife: life,
      color, size: size * (0.5 + Math.random()), gravity: 0.05
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.98;
    p.life -= dt * 60;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- LOBBY ----
const JOIN_KEYS = [
  ['a','d','w','s'],
  ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'],
  ['f','h','t','g'],
  ['Numpad4','Numpad6','Numpad8','Numpad5']
];

function tapToJoinPlayer(pi) {
  if (players.find(p => p.index === pi)) return;
  players.push({
    index: pi,
    power: 0,
    color: PLAYER_COLORS[pi],
    name: PLAYER_NAMES[pi],
    isAi: false
  });
  playSound('pickup');
  renderLobby();
  checkStartReady();
}

function addBotPlayer() {
  for (let pi = 1; pi < 4; pi++) {
    if (!players.find(p => p.index === pi)) {
      players.push({
        index: pi,
        power: Math.floor(Math.random() * 4),
        color: PLAYER_COLORS[pi],
        name: 'AI BOT ' + (pi + 1),
        isAi: true
      });
      playSound('pickup');
      renderLobby();
      checkStartReady();
      return;
    }
  }
}

function handleLobbyJoin(key) {
  for (let pi = 0; pi < 4; pi++) {
    if (players.find(p => p.index === pi)) continue;
    if (JOIN_KEYS[pi].includes(key)) {
      tapToJoinPlayer(pi);
      return;
    }
  }
}

function checkStartReady() {
  const btn = document.getElementById('start-btn');
  if (!btn) return;
  if (players.length >= 2) {
    btn.style.opacity = '1'; btn.disabled = false;
    btn.textContent = 'START FIGHT';
  } else if (players.length === 1) {
    btn.style.opacity = '1'; btn.disabled = false;
    btn.textContent = 'FIGHT (VS BOT)';
  } else {
    btn.style.opacity = '0.4'; btn.disabled = true;
    btn.textContent = 'JOIN TO PLAY';
  }
}

function renderLobby() {
  const grid = document.getElementById('lobby-grid');
  grid.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const p = players.find(pp => pp.index === i);
    const joined = !!p;
    const color = PLAYER_COLORS[i];
    const div = document.createElement('div');
    div.className = `player-slot bg-glass ${joined ? 'joined' : ''}`;
    div.style.borderColor = joined ? color : 'rgba(255,255,255,0.05)';
    div.style.color = color;
    if (joined) {
      div.innerHTML = `
        <div class="title-font" style="font-size:20px;font-weight:700;color:${color}">${p.isAi ? '🤖 ' : ''}${p.name}</div>
        <div style="font-size:12px;color:#aaa;margin:6px 0">${p.isAi ? 'AI BOT' : 'PLAYER'} ✓</div>
        <div style="font-size:11px;color:#888;margin-bottom:6px">SELECT POWER</div>
        <div class="power-select" id="power-sel-${i}">
          ${POWER_NAMES.map((pn, pi) => `
            <div class="power-btn ${p.power === pi ? 'selected' : ''}" style="color:${p.power === pi ? POWER_COLORS[pi] : '#ccc'};border-color:${p.power === pi ? POWER_COLORS[pi] : 'rgba(255,255,255,0.2)'}"
              onclick="selectPower(${i},${pi})">${pn}</div>
          `).join('')}
        </div>`;
    } else {
      const keyHints = JOIN_KEYS[i].join(' / ').replace('Arrow','');
      div.style.cursor = 'pointer';
      div.onclick = () => tapToJoinPlayer(i);
      div.innerHTML = `
        <div style="font-size:36px;color:rgba(255,255,255,0.2)">+</div>
        <div style="font-size:14px;color:rgba(255,255,255,0.5);margin-top:6px">${PLAYER_NAMES[i]}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px">Tap or Press ${keyHints}</div>`;
    }
    grid.appendChild(div);
  }
  checkStartReady();
}

        <div style="font-size:11px;color:${gp ? '#39ff14' : '#666'}">
          ${gp ? `🎮 ${gp.id.substring(0, 24)}` : `🎮 Gamepad ${pi+1}: Disconnected`}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">
        ${actions.map((a, ai) => {
          const isListeningKey = settingsListening && settingsListening.playerIdx === pi && settingsListening.action === a && settingsListening.type === 'key';
          const isListeningGp = settingsListening && settingsListening.playerIdx === pi && settingsListening.action === a && settingsListening.type === 'gamepad';
          const gpCode = gamepadBindings[pi] ? gamepadBindings[pi][a] : DEFAULT_GAMEPAD_BINDINGS[pi][a];
          return `
            <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:8px 6px;text-align:center;">

                  ⌨ ${isListeningKey ? '...' : formatKeyName(keyBindings[pi][a])}

                <span class="key-bind ${isListeningGp ? 'listening' : ''}" style="font-size:10px;padding:3px 6px;border-color:rgba(0,212,255,0.3);color:#00e5ff;"
                  title="Click then press Gamepad Button" onclick="startListening(${pi},'${a}','gamepad')">

                </span>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  panel.innerHTML = html;
}

function formatKeyName(k) {
  if (!k) return '?';
  if (k === ' ' || k === 'Space') return 'SPC';
  if (k.startsWith('Arrow')) return k.replace('Arrow','↑↓←→'.charAt(['Up','Down','Left','Right'].indexOf(k.replace('Arrow',''))));
  if (k.startsWith('Numpad')) return 'N' + k.replace('Numpad','');
  return k.toUpperCase();
}

function startListening(pi, action, type = 'key') {
  settingsListening = {playerIdx: pi, action, type};
  renderSettings();
}

function handleSettingsBind(key) {
  if (!settingsListening) return;
  const k = key === ' ' ? 'Space' : key;
  if (k === 'Escape') { settingsListening = null; renderSettings(); return; }
  if (settingsListening.type === 'key') {
    keyBindings[settingsListening.playerIdx][settingsListening.action] = k;
    saveBindings();
    settingsListening = null;
    renderSettings();
  }
}

function handleSettingsGamepadBind(code) {
  if (!settingsListening || settingsListening.type !== 'gamepad') return;
  if (!gamepadBindings[settingsListening.playerIdx]) {
    gamepadBindings[settingsListening.playerIdx] = { ...DEFAULT_GAMEPAD_BINDINGS[0] };
  }
  gamepadBindings[settingsListening.playerIdx][settingsListening.action] = code;
  saveBindings();
  settingsListening = null;
  renderSettings();
}

  switch(arenaIdx) {
    case 0: // Floating Lava Platforms

      platforms.push({x:200,y:600,w:250,h:20,type:'solid',color:'#444',sinkable:false});

      platforms.push({x:1150,y:500,w:200,h:20,type:'solid',color:'#555',sinkable:true,sinkTimer:0,originalY:500,sunk:false});
      // Upper platforms
      platforms.push({x:350,y:350,w:180,h:16,type:'solid',color:'#555',sinkable:false});
      platforms.push({x:700,y:280,w:200,h:16,type:'solid',color:'#444',sinkable:false});
      platforms.push({x:1050,y:350,w:180,h:16,type:'solid',color:'#555',sinkable:false});
      // Bottom large
